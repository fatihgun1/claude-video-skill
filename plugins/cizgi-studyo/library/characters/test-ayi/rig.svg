          <g id="mouth_O" display="none">
            <ellipse cx="500" cy="458" rx="15" ry="18" fill="#5a2b2b" stroke="#3a2a20" stroke-width="5"/>
          </g>
          <g id="mouth_U" display="none">
            <ellipse cx="500" cy="456" rx="10" ry="11" fill="#5a2b2b" stroke="#3a2a20" stroke-width="5"/>
          </g>
          <g id="mouth_MBP" display="none">
            <path d="M480 454 L520 454" fill="none" stroke="#3a2a20" stroke-width="7" stroke-linecap="round"/>
          </g>
          <g id="mouth_FV" display="none">
