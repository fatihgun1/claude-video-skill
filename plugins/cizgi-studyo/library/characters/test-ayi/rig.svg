            <rect x="488" y="447" width="24" height="7" rx="2" fill="#ffffff"/>
          </g>
          <g id="mouth_L" display="none">
            <ellipse cx="500" cy="458" rx="19" ry="15" fill="#5a2b2b" stroke="#3a2a20" stroke-width="5"/>
            <ellipse cx="500" cy="451" rx="9" ry="5" fill="#e67b7b"/>
          </g>
