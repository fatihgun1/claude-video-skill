          <circle cx="648" cy="215" r="34" fill="var(--belly, #f6e3c8)"/>
        </g>
        <ellipse cx="500" cy="365" rx="195" ry="180" fill="var(--fur, #d9a877)" stroke="var(--line, #6b4a33)" stroke-width="8"/>
        <circle cx="395" cy="425" r="30" fill="#f4a3a0" opacity="0.6"/>
        <circle cx="605" cy="425" r="30" fill="#f4a3a0" opacity="0.6"/>
        <g id="eye_R">
          <g id="eye_R_open">
            <ellipse cx="430" cy="350" rx="23" ry="29" fill="#3a2a20"/>
