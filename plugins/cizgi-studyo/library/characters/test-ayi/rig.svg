<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- TEMPORARY test rig for engine development (Faz 1). Not part of the starter pack.
       Colours use CSS variables so episodes can recolour without editing the drawing:
       --fur, --fur-dark, --belly, --accent, --line -->
  <g id="root">
    <g id="leg_R" data-pivot="440,770">
      <line x1="440" y1="770" x2="430" y2="900" stroke="var(--line, #6b4a33)" stroke-width="96" stroke-linecap="round"/>
      <line x1="440" y1="770" x2="430" y2="900" stroke="var(--fur, #d9a877)" stroke-width="82" stroke-linecap="round"/>
      <ellipse cx="420" cy="920" rx="62" ry="34" fill="var(--fur-dark, #b98656)" stroke="var(--line, #6b4a33)" stroke-width="7"/>
    </g>
    <g id="leg_L" data-pivot="560,770">
      <line x1="560" y1="770" x2="570" y2="900" stroke="var(--line, #6b4a33)" stroke-width="96" stroke-linecap="round"/>
      <line x1="560" y1="770" x2="570" y2="900" stroke="var(--fur, #d9a877)" stroke-width="82" stroke-linecap="round"/>
      <ellipse cx="580" cy="920" rx="62" ry="34" fill="var(--fur-dark, #b98656)" stroke="var(--line, #6b4a33)" stroke-width="7"/>
    </g>
    <g id="body" data-pivot="500,800">
      <g id="tail" data-pivot="500,760">
        <circle cx="500" cy="790" r="34" fill="var(--fur-dark, #b98656)" stroke="var(--line, #6b4a33)" stroke-width="7"/>
      </g>
      <ellipse cx="500" cy="680" rx="165" ry="170" fill="var(--fur, #d9a877)" stroke="var(--line, #6b4a33)" stroke-width="8"/>
      <ellipse cx="500" cy="705" rx="105" ry="115" fill="var(--belly, #f6e3c8)"/>
      <path d="M380 540 Q500 590 620 540 L615 580 Q500 625 385 580 Z" fill="var(--accent, #e8736c)" stroke="var(--line, #6b4a33)" stroke-width="7" stroke-linejoin="round"/>
      <g id="head" data-pivot="500,540">
        <g id="ear_R" data-pivot="370,250">
          <circle cx="352" cy="215" r="64" fill="var(--fur, #d9a877)" stroke="var(--line, #6b4a33)" stroke-width="8"/>
          <circle cx="352" cy="215" r="34" fill="var(--belly, #f6e3c8)"/>
        </g>
        <g id="ear_L" data-pivot="630,250">
