        <line x1="630" y1="590" x2="650" y2="690" stroke="var(--fur, #d9a877)" stroke-width="66" stroke-linecap="round"/>
        <g id="arm_L_lower" data-pivot="650,690">
          <line x1="650" y1="690" x2="655" y2="770" stroke="var(--line, #6b4a33)" stroke-width="76" stroke-linecap="round"/>
