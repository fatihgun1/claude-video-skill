<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çizgi Stüdyo paneli</title>
<link rel="stylesheet" href="/panel/panel.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"></span>
    <button id="home-btn" class="btn small home-btn" type="button" title="Bütün bölümler ve yeni bölüm">← Projeler</button>
    <h1 class="ep-title"><span id="title">Çizgi Stüdyo</span></h1>
  </div>
  <button id="story" class="btn small" type="button" title="Hikâye kartları: fikir, karakterler, sahne sahne olaylar (taslak)">Hikâye</button>
  <button id="ep-settings" class="btn small" type="button" title="Bütün bölüm: ses düzeyleri, müzik, altyazı">Bölüm ayarları</button>
  <button id="insp-toggle" class="btn small narrow-only" type="button" aria-controls="inspector-pane" aria-expanded="false" title="Seçili shot ya da şeyin ayarları">Özellikler</button>
  <ol class="steps" id="steps" aria-label="Üretim adımları"></ol>
  <span class="spacer"></span>
  <span id="state" class="state" role="status"></span>
  <button id="undo" class="btn icon" disabled title="Geri al (Ctrl+Z)" aria-label="Geri al">↶</button>
  <button id="redo" class="btn icon" disabled title="Yinele (Ctrl+Y)" aria-label="Yinele">↷</button>
  <button id="revert" class="btn" disabled title="Kaydedilmemiş bütün değişiklikleri at">Hepsini at</button>
  <button id="save" class="btn primary" disabled title="Kaydet (Ctrl+S)">Kaydet</button>
</header>
<main class="editor">
  <nav class="rail" id="rail" aria-label="Sol paneller"></nav>
  <aside class="pane library" id="left" aria-labelledby="left-title">
    <div class="lhead">
      <h2 id="left-title">Karakter</h2>
      <button id="left-close" class="btn icon" type="button" aria-label="Paneli kapat" title="Paneli kapat: sahne büyür">✕</button>
    </div>
    <div id="proje-pane" class="proje-pane" hidden></div>
    <div id="lib-pane" class="lib-pane">
      <input id="lib-search" class="search" type="search" placeholder="Kütüphanede ara" aria-label="Kütüphanede ara">
      <p id="lib-hint" class="hint"></p>
      <div id="lib-cards" class="cards"></div>
    </div>
  </aside>
  <section class="stage-wrap" aria-label="Sahne">
    <div class="vresize left" id="left-resize" role="separator" aria-orientation="vertical" aria-controls="left" aria-label="Sol panelin genişliği" tabindex="0" title="Sürükle: sol panelin genişliği (←/→ ile de olur, çift tık: ilk hali)"></div>
    <div class="vresize right" id="right-resize" role="separator" aria-orientation="vertical" aria-controls="inspector-pane" aria-label="Sağ panelin genişliği" tabindex="0" title="Sürükle: sağ panelin genişliği (←/→ ile de olur, çift tık: ilk hali)"></div>
    <div class="stage-box">
      <div class="stage" id="stage">
        <iframe id="frame" title="Önizleme" tabindex="-1"></iframe>
        <div class="edit" id="edit" aria-label="Sahnede düzenleme"></div>
        <div class="over" id="over" hidden></div>
      </div>
    </div>
    <div class="transport">
      <button id="play" class="btn icon" aria-label="Oynat" title="Oynat / durdur (Boşluk)">▶</button>
      <span id="clock" class="clock">0.00 s</span>
      <input type="range" id="time" min="0" max="1000" step="1" value="0" aria-label="Zaman" title="←/→ bir kare, Shift ile bir saniye">
      <button id="mute" class="btn icon" aria-label="Sesi kapat" aria-pressed="false" title="Önizlemenin sesi">🔊</button>
      <div class="seg" role="group" aria-label="Biçim">
        <button id="fmt-16x9" class="btn small" aria-pressed="true" title="Yatay (16:9)">16:9</button>
        <button id="fmt-9x16" class="btn small" aria-pressed="false" title="Dikey (9:16)">9:16</button>
      </div>
      <button id="safe" class="btn small" aria-pressed="false" title="Güvenli alanları ve altyazı bölgesini göster">Güvenli alan</button>
      <details class="layers" id="layers">
        <summary class="btn small" title="Önizlemede katmanları gizle ya da göster (bölüm değişmez)">Katmanlar</summary>
        <div class="layers-menu" id="layers-menu"></div>
      </details>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
  </section>
  <aside class="pane inspector" id="inspector-pane" aria-label="Özellikler">
    <div class="insp-head narrow-only"><h2>Özellikler</h2><button id="insp-close" class="btn icon" type="button" aria-label="Özellikleri kapat" title="Kapat (Esc)">✕</button></div>
    <details class="claude" id="claude" aria-label="Claude'a yaz"></details>
    <div id="inspector"></div>
  </aside>
  <footer class="timeline" aria-label="Zaman çizelgesi">
    <div class="tl-resize" id="tl-resize" role="separator" aria-orientation="horizontal" aria-label="Zaman çizelgesinin yüksekliği" tabindex="0" title="Sürükle: zaman çizelgesinin yüksekliği (↑/↓ ile de olur, çift tık: ilk hali)"></div>
    <div class="tl-head">
      <span class="tl-title">Zaman çizelgesi</span>
      <div class="seg" role="group" aria-label="Zaman çizelgesinde gösterilen">
        <button id="tl-sahne" class="btn small" type="button" aria-pressed="true" title="Yalnızca seçili shot'ın sahnesi">Sahne</button>
        <button id="tl-bolum" class="btn small" type="button" aria-pressed="false" title="Bütün bölüm">Bölüm</button>
      </div>
      <button id="shot-add" class="btn small" title="Seçili shot'tan sonra, aynı oyuncularla boş bir shot ekle">+ Shot</button>
      <button id="shot-dup" class="btn small" title="Seçili shot'ı çoğalt (Ctrl+D). Replikler kopyalanmaz: replikler senaryodan gelir.">Çoğalt</button>
      <button id="shot-del" class="btn small danger" title="Seçili shot'ı sil (Delete)">Sil</button>
      <span class="spacer"></span>
      <button id="mixer" class="btn small" title="İz düzeyleri ve arka plan müziği">Mikser</button>
      <span class="muted small" id="tl-info"></span>
    </div>
    <div class="tl-body">
      <div class="tl-labels" id="tl-labels" aria-hidden="true"></div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="ruler" id="tl-ruler" title="Tıkla ya da sürükle: oynatma kafası"></div>
        <div class="tracks" id="tl-tracks"></div>
      </div>
    </div>
  </footer>
</main>
<section id="projects" class="home" aria-label="Projeler" hidden></section>
<dialog id="uretim" class="projects uretim" aria-label="Üretim"></dialog>
<dialog id="inceleme" class="projects uretim" aria-label="Sahne incelemesi"></dialog>
<dialog id="hikaye" class="projects hikaye" aria-label="Hikâye kartları"></dialog>
<script type="module" src="/panel/app.js"></script>
</body>
</html>
